name = "tts-voice-magic"
main = "index.js"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "tts-voice-magic"

[env.staging]
name = "tts-voice-magic-staging"

# 变量配置（如果需要的话）
[vars]
# API 鉴权密钥（可选）：
# - 设置后，所有 /v1/audio/speech 与 /v1/audio/transcriptions 请求必须携带
#   Authorization: Bearer <API_KEY> 或 x-api-key: <API_KEY>，否则返回 401。
# - 留空/不设置：保持公开访问（向后兼容）。
# 生产环境更推荐在 Cloudflare Dashboard → Worker → Settings → Variables and Secrets
# 中将其配置为 Secret（类型 secret），避免明文暴露在代码仓库。
# API_KEY = "your-secret-key"

# 如果需要 KV 存储（可选）
# [[kv_namespaces]]
# binding = "MY_KV_NAMESPACE"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"

# 如果需要 D1 数据库（可选）
# [[d1_databases]]
# binding = "DB"
# database_name = "my-database"
# database_id = "your-database-id"

# 路由配置
[triggers]
crons = []

